<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站长后台 · NZ-STATION</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0d1117;--card:rgba(22,27,34,.95);--bd:#30363d;--fg:#e6edf3;--dim:#8b949e;--grn:#3fb950;--blu:#58a6ff;--grnB:#238636}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle,#161b2280 1px,transparent 1px);background-size:24px 24px;color:var(--fg);font-family:ui-monospace,'JetBrains Mono',Consolas,Menlo,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.6}
.term{width:100%;max-width:920px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--dim)}
.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f56}.y{background:#ffbd2e}.g{background:#27c93f}
.tbody{padding:24px 28px}
h1{color:var(--grn);font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:20px}
input{background:#0a0d12;border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:9px 14px;font-size:14px;font-family:inherit;width:min(280px,80%)}
.btn{border:1px solid var(--grnB);color:var(--grn);background:rgba(35,134,54,.12);border-radius:6px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:inherit}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{border:1px solid var(--bd);border-radius:4px;padding:4px 12px;font-size:11px;color:var(--dim)}
.stat b{color:var(--grn);font-weight:normal}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);text-align:left;font-weight:normal;border-bottom:1px solid var(--bd);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid rgba(48,54,61,.5);padding:7px 8px;vertical-align:top}
tr:hover td{background:rgba(88,166,255,.04)}
.geo{color:#e3b341}.gate{color:var(--grn)}.skip{color:var(--dim)}
.err{color:#f85149;font-size:13px;margin-top:10px}
.back{margin-top:18px;font-size:12px}
a{color:var(--blu);text-decoration:none}
</style>
</head>
<body>
<div class="term">
  <div class="tbar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>nz-station — admin — 访客足迹</span></div>
  <div class="tbody">
    <div id="login">
      <h1>站长登录</h1>
      <div class="sub">nz-station · visitor log · 仅站长</div>
      <input type="password" id="pw" placeholder="站长口令" onkeydown="if(event.key==='Enter')tryLogin()">
      <button class="btn" onclick="tryLogin()">进入</button>
      <div class="err" id="lerr"></div>
    </div>
    <div id="panel" style="display:none">
      <h1>访客足迹雷达</h1>
      <div class="sub">数据源：wbsync · nz_visits · <button class="btn" style="padding:4px 12px;font-size:11px" onclick="load()">刷新</button> <a href="index.html" style="margin-left:10px">← 回前台</a></div>
      <div class="stats" id="stats"></div>
      <div style="overflow-x:auto"><table id="tbl"><thead><tr><th>时间</th><th>来源</th><th>城市</th><th>坐标</th><th>设备</th><th>来路</th></tr></thead><tbody></tbody></table></div>
      <div class="err" id="perr"></div>
    </div>
  </div>
</div>
<script>
var ADMIN_PASS = 'nz-8211d6';
var WBSYNC = 'https://wb.reeve10001.top/wbsync/api/';
var WBSYNC_KEY = 'wb_';
function tryLogin(){
  if (document.getElementById('pw').value === ADMIN_PASS) { document.getElementById('login').style.display = 'none'; document.getElementById('panel').style.display = 'block'; load(); }
  else document.getElementById('lerr').textContent = '口令错误';
}
function load(){
  document.getElementById('tbl').querySelector('tbody').innerHTML = '<tr><td colspan="6" style="color:var(--dim)">拉取中…</td></tr>';
  fetch(WBSYNC + 'all?k=' + WBSYNC_KEY).then(function(r){ return r.json(); }).then(function(d){
    var v = (d && d.data && d.data.nz_visits) || [];
    v.sort(function(a, b){ return (b.t || '').localeCompare(a.t || ''); });
    var geo = v.filter(function(x){ return x.lat; }).length;
    var cities = {}; v.forEach(function(x){ if (x.city) cities[x.city] = 1; });
    document.getElementById('stats').innerHTML = '<span class="stat">总足迹 <b>' + v.length + '</b></span><span class="stat">GPS 签到 <b>' + geo + '</b></span><span class="stat">城市数 <b>' + Object.keys(cities).length + '</b></span>';
    var rows = v.map(function(x){
      var srcCls = x.lat ? 'gate' : 'skip';
      var srcTxt = x.lat ? '定位签到' : (x.src === 'denied' ? '拒绝授权' : '直接进入');
      return '<tr><td>' + (x.t || '—') + '</td><td class="' + srcCls + '">' + srcTxt + '</td><td>' + (x.city || '—') + '</td><td class="geo">' + (x.lat ? x.lat + ', ' + x.lng + ' (±' + (x.acc || '?') + 'm)' : '—') + '</td><td style="color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + (x.ua || '').replace(/"/g, '&quot;') + '">' + (x.ua || '—').slice(0, 40) + '</td><td style="color:var(--dim);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (x.ref || '—') + '</td></tr>';
    }).join('');
    document.getElementById('tbl').querySelector('tbody').innerHTML = rows || '<tr><td colspan="6" style="color:var(--dim)">暂无足迹</td></tr>';
  }).catch(function(){ document.getElementById('perr').textContent = '拉取失败（网络/密钥）'; });
}
</script>
</body>
</html>
